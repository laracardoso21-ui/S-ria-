<form action="#" method="post">
  <div>
    <label for="nome-visitante">1. Qual é o seu nome completo?</label><br>
    <input type="text" id="nome-visitante" name="nome" required placeholder="Digite seu nome">
  </div>
  <br>

  <div>
    <label for="email-visitante">2. Qual é o seu e-mail de contato?</label><br>
    <input type="email" id="email-visitante" name="email" required placeholder="exemplo@email.com">
  </div>
  <br>

  <div>
    <label>3. Em qual período você visitou a sala da Síria/Líbano?</label><br>
    <input type="radio" id="turno-manha" name="turno_visita" value="manha" required>
    <label for="turno-manha">Manhã</label><br>
    
    <input type="radio" id="turno-tarde" name="turno_visita" value="tarde">
    <label for="turno-tarde">Tarde</label><br>
    
    <input type="radio" id="turno-noite" name="turno_visita" value="noite">
    <label for="turno-noite">Noite</label>
  </div>
  <br>

  <div>
    <label for="nota-exposicao">4. De 1 a 10, que nota dá para a apresentação da sala sobre cultura Síria e Líbano?</label><br>
    <input type="number" id="nota-exposicao" name="nota_exposicao" min="1" max="10" required>
  </div>
  <br>

  <div>
    <label for="atraca-favorita">5. Qual elemento da cultura Síria e Líbano mais chamou a sua atenção?</label><br>
    <select id="atraca-favorita" name="atracao_favorita" required>
      <option value="" disabled selected>Selecione uma opção</option>
      <option value="culinaria">Culinária tradicional </option>
      <option value="vestimentas">Vestimentas e trajes típicos</option>
      <option value="musica">Música </option>
      <option value="historia">História e património arquitetónico</option>
      <option value="artesanato">Artesanato e enfeites</option>
    </select>
  </div>
  <br>

  <div>
    <button type="submit">Enviar</button>
  </div>
</form>
